name = "wasmgc"
defaultTargets = ["Demo", "DemoU32", "JinroFlat", "emitwasm"]

# The real engine, unchanged.
[[require]]
name = "jinro"
path = "../../lean-engine"

# A tiny program to compile.
[[lean_lib]]
name = "Demo"

[[lean_lib]]
name = "DemoU32"

# jinro's rules behind a List Nat boundary (no strings, no JSON).
[[lean_lib]]
name = "JinroFlat"

# The backend: reads a module's compiled IR from its .olean and prints WasmGC text (WAT).
[[lean_exe]]
name = "emitwasm"
root = "Emit"
supportInterpreter = true
