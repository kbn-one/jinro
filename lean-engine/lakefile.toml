name = "jinro"
defaultTargets = ["Jinro", "emitwasm"]

# The jinro engine written directly in Lean: the rules (`Jinro.Engine`), the JSON protocol
# (`Jinro.Wire`) and the theorems about the rules (`Jinro.Proofs`, checked by every build).
[[lean_lib]]
name = "Jinro"

# Our WasmGC backend: reads the IR Lean's compiler produces for a module and prints a WasmGC
# text module, with no Lean C runtime. `deno task wasm` runs it on `Jinro.Wire.run`.
[[lean_exe]]
name = "emitwasm"
root = "WasmGC.Emit"
supportInterpreter = true
