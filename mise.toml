# Dev tools, and the build the GitHub Pages workflow runs.
# `.github/workflows/pages.yml` calls kuboon/workflows' reusable Pages workflow, which installs
# mise and runs `mise run build` (its default build-command) with BASE_URL set.
[tools]
deno = "latest"
node = "latest"
# wasm32-wasip2 is what `deno task wasm` builds rust/jinro-wasm for.
rust = { version = "latest", targets = "wasm32-wasip2" }

[tasks.build]
description = "Build the jinro wasm for the browser, then the static site into web/dist"
run = "deno task wasm && deno task build"
