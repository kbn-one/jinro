# Dev tools, and the build the GitHub Pages workflow runs.
# `.github/workflows/pages.yml` calls kuboon/workflows' reusable Pages workflow, which installs
# mise and runs `mise run build` (its default build-command) with BASE_URL set.
[tools]
deno = "latest"

[tasks.build]
description = "Build the engine (Lean, our WasmGC backend) for the browser, then the static site into web/dist"
# scripts/with-lean.sh installs elan (Lean) and wasm-tools when they are missing.
run = "scripts/with-lean.sh deno task wasm && deno task build"
