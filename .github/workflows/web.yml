name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The engine (lean-engine: Lean, compiled by our WasmGC backend) goes to
      # web/client/static/jinro/jinro.wasm; the demo and the tests need it.
      # with-lean.sh installs elan and wasm-tools; `lake build` also checks the proofs.
      - run: scripts/with-lean.sh deno task wasm
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - run: deno task build:cf
      - run: deno task cf deploy --prebuilt --dry-run
      # @lightpanda/browser >= 1.6 no longer fetches its binary on install.
      - run: deno task lightpanda:install
      - run: deno task test:browser
