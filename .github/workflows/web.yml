name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The jinro wasm demo imports the jco output, so it has to exist before check/build.
      - run: rustup target add wasm32-wasip2
      - run: deno task wasm
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - run: deno task build:cf
      - run: deno task cf deploy --prebuilt --dry-run
      # @lightpanda/browser >= 1.6 no longer fetches its binary on install.
      - run: deno task lightpanda:install
      - run: deno task test:browser
