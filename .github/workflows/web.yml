name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Deno, elan (Lean) and wasm-tools, as mise.toml lists them.
      - uses: jdx/mise-action@v5
      # The engine (lean-engine: Lean, compiled by our WasmGC backend) goes to
      # web/client/static/jinro/jinro.wasm; the demo and the tests need it.
      # `lake build` also checks the proofs. `mise exec` puts ~/.elan/bin on PATH.
      - run: mise exec -- deno task wasm
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - run: deno task build:cf
      - run: deno task cf deploy --prebuilt --dry-run
      # @lightpanda/browser >= 1.6 no longer fetches its binary on install.
      - run: deno task lightpanda:install
      - run: deno task test:browser
