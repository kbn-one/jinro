[package]
name = "jinro-wasi"
version = "0.1.0"
edition = "2021"
description = "jinro-core as a WASI command: one JSON request on stdin, one JSON response on stdout"
license = "MIT"

[[bin]]
name = "jinro"
path = "src/main.rs"

[dependencies]
jinro-core = { path = "../jinro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
